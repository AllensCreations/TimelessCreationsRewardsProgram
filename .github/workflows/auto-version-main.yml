name: Auto Version Bump (Main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    # Skip if the commit was made by this workflow (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          # Find the latest TCRP-Mainv tag
          LATEST_TAG=$(git tag -l 'TCRP-Mainv*' --sort=-version:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No existing tag — start at 1.00.0
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            # Parse: TCRP-Mainv1.02.0 → 1, 02, 0
            VERSION_STR=$(echo "$LATEST_TAG" | sed 's/TCRP-Mainv//')
            MAJOR=$(echo "$VERSION_STR" | cut -d. -f1)
            MINOR=$(echo "$VERSION_STR" | cut -d. -f2 | sed 's/^0*//' )
            PATCH=$(echo "$VERSION_STR" | cut -d. -f3)
            # Default MINOR to 0 if empty after stripping leading zeros
            MINOR=${MINOR:-0}
          fi

          # Increment minor by 1 (+0.01)
          MINOR=$((MINOR + 1))

          # Roll over: if minor reaches 100, bump major
          if [ "$MINOR" -ge 100 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi

          # Format minor as two digits (zero-padded)
          MINOR_FMT=$(printf "%02d" "$MINOR")

          NEW_VERSION="${MAJOR}.${MINOR_FMT}.${PATCH}"
          NEW_TAG="TCRP-Mainv${NEW_VERSION}"
          DISPLAY_VERSION="TCRP Mainv${NEW_VERSION}"

          echo "previous_tag=${LATEST_TAG:-none}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "display_version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"

          echo "📦 Previous: ${LATEST_TAG:-none}"
          echo "📦 New:      ${NEW_TAG} (${DISPLAY_VERSION})"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ steps.version.outputs.new_tag }}" \
            -m "${{ steps.version.outputs.display_version }}"

          git push origin "${{ steps.version.outputs.new_tag }}"

          echo "✅ Tagged: ${{ steps.version.outputs.new_tag }}"

      - name: Summary
        run: |
          echo "## 📦 Version Bump" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous** | \`${{ steps.version.outputs.previous_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **New Tag** | \`${{ steps.version.outputs.new_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Display** | **${{ steps.version.outputs.display_version }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
