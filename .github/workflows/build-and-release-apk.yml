name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - NewVersion
      - MessengerBotVersion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-Increment Version (+0.1)
        id: versioning
        run: |
          set -e
          # Read current version and code from package.json as single source of truth
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version || '2.49.0')")
          CURRENT_CODE=$(node -e "console.log(require('./package.json').versionCode || 62)")
          
          NEW_CODE=$((CURRENT_CODE + 1))

          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"

          echo "Bumping package.json: $CURRENT_VERSION (Code $CURRENT_CODE) -> $NEW_VERSION (Code $NEW_CODE)"

          # Update package.json as single source of truth
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            pkg.versionCode = $NEW_CODE;
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Generate rich changelog with Features, Bug Fixes, and Improvements
          node scripts/generate-release-notes.js --version "$NEW_VERSION" --code "$NEW_CODE"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Sync Web Assets
        run: |
          node scripts/sync-assets.js

      - name: Clean Invalid Gradle Overrides & SDK Paths
        run: |
          # Remove stale local.properties containing machine-specific sdk.dir
          find android -name "local.properties" -delete || true
          
          # Remove any hardcoded aapt2 override from gradle.properties files
          find android -name "gradle.properties" -exec sed -i '/aapt2FromMavenOverride/d' {} + || true

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/android-tcrp/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android/android-tcrp
          rm -rf app/build/outputs/apk
          ./gradlew assembleRelease

      - name: Stage APK Files
        run: |
          mkdir -p public android
          APK_PATH=$(find android/android-tcrp/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!" && exit 1
          fi
          echo "Found compiled APK at $APK_PATH"
          cp "$APK_PATH" public/TimelessRewards.apk
          cp "$APK_PATH" "android/TimelessRewards-v${{ steps.versioning.outputs.new_version }}.apk"

      - name: Commit and Push to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout ${{ github.ref_name }}
          git add -f package.json views/version.json public/version.json CHANGELOG.md android/android-tcrp/app/build.gradle android/app/build.gradle public/TimelessRewards.apk "android/TimelessRewards-v${{ steps.versioning.outputs.new_version }}.apk"
          git commit -m "chore(release): bump version to v${{ steps.versioning.outputs.new_version }} (Build ${{ steps.versioning.outputs.new_code }}) [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.versioning.outputs.new_version }}"
          name: "Timeless Rewards v${{ steps.versioning.outputs.new_version }} (Build ${{ steps.versioning.outputs.new_code }})"
          body_path: RELEASE_BODY.md
          files: |
            public/TimelessRewards.apk
            android/TimelessRewards-v${{ steps.versioning.outputs.new_version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
