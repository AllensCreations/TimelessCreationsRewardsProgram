<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Mini Messenger Inbox</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --blue:#5c8de0; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:20px;min-height:100vh;}
  .container{max-width:1420px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:16px;flex-wrap:wrap;gap:12px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.8rem;color:var(--gold);}
  .nav-links{display:flex;gap:10px;align-items:center;}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}

  .inbox-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;height:calc(100vh - 150px);min-height:600px;}
  @media(max-width:900px){.inbox-grid{grid-template-columns:1fr;height:auto;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;}
  .chat-list{overflow-y:auto;flex:1;}
  .chat-thread-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:background 0.2s;}
  .chat-thread-item:hover, .chat-thread-item.active{background:var(--surface2);}
  .thread-name{font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:700;color:var(--text);}
  .thread-preview{font-size:0.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .chat-pane{display:flex;flex-direction:column;height:100%;}
  .chat-header{padding:16px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;justify-content:space-between;align-items:center;}
  .chat-messages{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,0.2);}
  .message-bubble{max-width:70%;padding:10px 14px;border-radius:8px;font-size:0.75rem;line-height:1.4;}
  .message-bubble.incoming{background:var(--surface2);border:1px solid var(--border);align-self:flex-start;}
  .message-bubble.outgoing{background:var(--gold-dim);border:1px solid rgba(201,168,76,0.3);color:var(--gold2);align-self:flex-end;}
  
  .chat-input-bar{padding:14px;border-top:1px solid var(--border);background:var(--surface2);display:flex;gap:10px;}
  .chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.75rem;outline:none;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0f;border:none;padding:10px 18px;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Mini Messenger Inbox</h1>
      <p style="font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">Live Facebook Page Chat Stream &amp; Webhook Logs</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
      <a href="/settings.html" class="btn-link">⚙️ Control Room</a>
    </div>
  </header>

  <div class="inbox-grid">
    <!-- Left: Conversations List -->
    <div class="card">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:0.85rem;color:var(--gold);">Conversations</div>
      <div class="chat-list" id="thread-list">
        <div style="padding:20px;text-align:center;color:var(--muted);font-size:0.7rem;">Loading inbox streams...</div>
      </div>
    </div>

    <!-- Right: Active Chat Pane -->
    <div class="card chat-pane">
      <div class="chat-header">
        <div>
          <strong id="active-chat-name" style="font-family:'Syne',sans-serif;font-size:0.9rem;color:var(--text);">Select a conversation</strong>
          <div id="active-chat-sub" style="font-size:0.62rem;color:var(--muted);">PSID: —</div>
        </div>
        <button class="btn" style="padding:6px 12px;font-size:0.68rem;" onclick="loadInbox()">↻ Refresh</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div style="text-align:center;color:var(--muted);margin-top:40px;font-size:0.72rem;">Choose a missionary thread from the left to inspect messages.</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="reply-input" class="chat-input" placeholder="Type reply message..." disabled/>
        <button class="btn" id="send-btn" onclick="sendReply()" disabled>Send</button>
      </div>
    </div>
  </div>
</div>

<script>
let threads = [];
let activePsid = null;

async function loadInbox() {
  try {
    const res = await fetch('/api/inbox');
    const data = await res.json();
    if (data.ok) {
      threads = data.threads || [];
      renderThreads();
      if (activePsid) {
        selectThread(activePsid);
      } else if (threads.length > 0) {
        selectThread(threads[0].psid);
      }
    }
  } catch (err) {
    console.error(err);
  }
}

function renderThreads() {
  const list = document.getElementById('thread-list');
  if (!threads.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.7rem;">No messenger logs found.</div>';
    return;
  }

  list.innerHTML = threads.map(t => `
    <div class="chat-thread-item ${activePsid === t.psid ? 'active' : ''}" onclick="selectThread('${t.psid}')">
      <div class="thread-name">${t.name || 'Missionary (' + t.psid.slice(-4) + ')'}</div>
      <div class="thread-preview">${t.lastMessage || 'Webhook activity recorded'}</div>
    </div>
  `).join('');
}

function selectThread(psid) {
  activePsid = psid;
  const thread = threads.find(t => t.psid === psid);
  if (!thread) return;

  document.getElementById('active-chat-name').textContent = thread.name || 'Missionary';
  document.getElementById('active-chat-sub').textContent = `PSID: ${psid}`;
  document.getElementById('reply-input').disabled = false;
  document.getElementById('send-btn').disabled = false;

  const msgBox = document.getElementById('chat-messages');
  msgBox.innerHTML = (thread.messages || []).map(m => `
    <div class="message-bubble ${m.sender === 'page' ? 'outgoing' : 'incoming'}">
      <div>${m.text}</div>
      <div style="font-size:0.55rem;color:var(--muted);margin-top:2px;text-align:right;">${new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
    </div>
  `).join('');
  msgBox.scrollTop = msgBox.scrollHeight;
  renderThreads();
}

async function sendReply() {
  const input = document.getElementById('reply-input');
  const text = input.value.trim();
  if (!text || !activePsid) return;

  try {
    const res = await fetch('/api/inbox', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ psid: activePsid, message: text })
    });
    const data = await res.json();
    if (data.ok) {
      input.value = '';
      loadInbox();
    } else {
      alert(data.error || 'Failed to send reply.');
    }
  } catch (err) {
    alert(err.message);
  }
}

window.addEventListener('DOMContentLoaded', loadInbox);
setInterval(loadInbox, 10000); // Auto-refresh inbox every 10s
</script>
</body>
</html>
