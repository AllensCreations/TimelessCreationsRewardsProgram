<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Invoicing & Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:24px;min-height:100vh;}
  .container{max-width:1000px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:16px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.8rem;color:var(--gold);}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .form-group{margin-bottom:14px;}
  .form-group label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px;}
  .form-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.75rem;width:100%;outline:none;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0f;border:none;padding:12px 24px;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;}
  #toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;}
  .toast{background:var(--surface2);border:1px solid var(--border);padding:12px 18px;border-radius:8px;font-size:0.72rem;min-width:240px;}
  .toast.success{border-left:4px solid var(--green);color:var(--text);}
  .toast.error{border-left:4px solid var(--red);color:var(--text);}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Cash Invoicing &amp; Billing Hub</h1>
      <p style="font-size:0.68rem;color:var(--muted);text-transform:uppercase;">Generate Customer Invoices &amp; Receipts</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
    </div>
  </header>

  <div class="card">
    <h3 style="font-family:'Syne',sans-serif;font-size:1rem;color:var(--gold);margin-bottom:14px;">Create New Invoice</h3>
    <div class="form-group">
      <label>Customer Email</label>
      <input type="email" id="inv-email" class="form-input" placeholder="customer@example.com"/>
    </div>
    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="inv-name" class="form-input" placeholder="Brother Cruz"/>
    </div>
    <div class="form-group">
      <label>Item Description &amp; Total Amount (PHP)</label>
      <input type="text" id="inv-item" class="form-input" placeholder="Custom Wooden Nametag — 450"/>
    </div>
    <button class="btn" onclick="generateInvoice()">🧾 Generate &amp; Send Invoice</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
function showToast(title, msg, type = 'success') {
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<strong>${title}</strong><div style="color:var(--muted);margin-top:2px;">${msg}</div>`;
  tc.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function generateInvoice() {
  const email = document.getElementById('inv-email').value.trim();
  const name = document.getElementById('inv-name').value.trim();
  const item = document.getElementById('inv-item').value.trim();

  if (!email || !item) { showToast("Error", "Fill in required fields.", "error"); return; }

  showToast("Generating...", "Creating cash invoice...", "success");
  try {
    const res = await fetch('/api/core/rewards', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'create_invoice', email, name, item })
    });
    const data = await res.json();
    if (data.ok) {
      showToast("Success", "Invoice generated and dispatched!", "success");
      document.getElementById('inv-email').value = '';
      document.getElementById('inv-name').value = '';
      document.getElementById('inv-item').value = '';
    } else {
      showToast("Error", data.error || "Failed to create invoice.", "error");
    }
  } catch (err) {
    showToast("Error", err.message, "error");
  }
}
</script>
</body>
</html>
