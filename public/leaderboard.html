<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Missionary Referral Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --blue:#5c8de0; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:20px;min-height:100vh;}
  .container{max-width:1200px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:16px;flex-wrap:wrap;gap:12px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.8rem;color:var(--gold);}
  .nav-links{display:flex;gap:10px;align-items:center;}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;}
  td{padding:14px 10px;font-size:0.78rem;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle;}
  .rank-pill{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:0.75rem;}
  .rank-1{background:var(--gold);color:#0a0a0f;}
  .rank-2{background:#c0c0c0;color:#0a0a0f;}
  .rank-3{background:#cd7f32;color:#0a0a0f;}
  .rank-other{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Missionary Referral Leaderboard</h1>
      <p style="font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">Top Point Champions &amp; Ambassador Advocates</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
      <a href="/settings.html" class="btn-link">⚙️ Control Room</a>
    </div>
  </header>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h3 style="font-family:'Syne',sans-serif;font-size:0.95rem;color:var(--gold);">🏆 Ambassador Rankings</h3>
      <span style="font-size:0.68rem;color:var(--muted);" id="total-ambassadors">Loading...</span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:50px;text-align:center;">Rank</th>
          <th>Missionary Name</th>
          <th>Cohort</th>
          <th>Referral Code</th>
          <th style="text-align:right;">Points Balance</th>
        </tr>
      </thead>
      <tbody id="leaderboard-tbody">
        <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px;">Loading leaderboard from Turso...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
async function loadLeaderboard() {
  try {
    const res = await fetch('/api/leaderboard');
    const data = await res.json();
    if (data.ok) {
      const list = data.missionaries || [];
      document.getElementById('total-ambassadors').textContent = `${list.length} Active Participants`;
      const tbody = document.getElementById('leaderboard-tbody');
      
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;">No missionaries found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map((m, idx) => {
        const rank = idx + 1;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
        return `
          <tr>
            <td style="text-align:center;"><div class="rank-pill ${rankClass}">${rank}</div></td>
            <td><strong style="font-family:'Syne',sans-serif;color:var(--text);">${m.name}</strong><div style="font-size:0.62rem;color:var(--muted);">${m.email}</div></td>
            <td><span style="font-size:0.62rem;padding:2px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);text-transform:uppercase;">${m.cohort || 'Elder'}</span></td>
            <td><code style="color:var(--gold);">${m.referral_code || 'TCRP'}</code></td>
            <td style="text-align:right;font-family:'Syne',sans-serif;font-weight:800;font-size:0.95rem;color:var(--gold);">${m.points} PTS</td>
          </tr>
        `;
      }).join('');
    }
  } catch (err) {
    console.error(err);
  }
}

window.addEventListener('DOMContentLoaded', loadLeaderboard);
</script>
</body>
</html>
