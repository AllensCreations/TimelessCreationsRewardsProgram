<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Missionary Onboarding & Pusher</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:24px;min-height:100vh;}
  .container{max-width:900px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:16px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.8rem;color:var(--gold);}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .form-group{margin-bottom:14px;}
  .form-group label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px;}
  .form-input, .form-textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.75rem;width:100%;outline:none;}
  .form-textarea{min-height:140px;resize:vertical;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0f;border:none;padding:12px 24px;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;}
  #toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;}
  .toast{background:var(--surface2);border:1px solid var(--border);padding:12px 18px;border-radius:8px;font-size:0.72rem;min-width:240px;}
  .toast.success{border-left:4px solid var(--green);color:var(--text);}
  .toast.error{border-left:4px solid var(--red);color:var(--text);}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Missionary Onboarding &amp; Pusher</h1>
      <p style="font-size:0.68rem;color:var(--muted);text-transform:uppercase;">Add Missionaries to Turso Database</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
    </div>
  </header>

  <div class="card">
    <h3 style="font-family:'Syne',sans-serif;font-size:1rem;color:var(--gold);margin-bottom:14px;">Single or Batch Missionary Entry</h3>
    <div class="form-group">
      <label>Missionary Data (CSV or JSON / Format: Email, Name, Cohort, Points)</label>
      <textarea id="pusher-input" class="form-textarea" placeholder="elder.cruz@missionary.org, Elder Cruz, Elder, 10&#10;sister.santos@missionary.org, Sister Santos, Sister, 5"></textarea>
    </div>
    <button class="btn" onclick="pushMissionaries()">🚀 Push to Turso Database</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
function showToast(title, msg, type = 'success') {
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<strong>${title}</strong><div style="color:var(--muted);margin-top:2px;">${msg}</div>`;
  tc.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function pushMissionaries() {
  const raw = document.getElementById('pusher-input').value.trim();
  if (!raw) { showToast("Error", "Enter missionary data.", "error"); return; }

  showToast("Processing...", "Pushing missionaries into database...", "success");
  try {
    const res = await fetch('/api/core/dashboard-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'bulk_push', data: raw })
    });
    const result = await res.json();
    if (result.ok) {
      showToast("Success", "Missionaries successfully added!", "success");
      document.getElementById('pusher-input').value = '';
    } else {
      showToast("Error", result.error || "Failed to push.", "error");
    }
  } catch (err) {
    showToast("Error", err.message, "error");
  }
}
</script>
</body>
</html>
