<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Settings &amp; Diagnostics | Timeless Creations</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.07);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --text:#e8e6f0; --muted:#716e88;
  }
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;}
  .container{max-width:850px;margin:20px auto;padding:0 16px 40px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
  .card h3{font-family:'Syne',sans-serif;font-size:1.1rem;color:var(--gold);margin-bottom:6px;}
  .form-group{margin-bottom:14px;}
  .form-group label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px;}
  .form-input,.form-select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.75rem;outline:none;width:100%;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0f;border:none;padding:10px 18px;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h3>✉️ Email Dispatch Diagnostic Testing</h3>
    <p style="font-size:0.7rem; color:var(--muted); margin-bottom:16px;">Test live delivery of different transactional email templates directly through Brevo SMTP.</p>

    <div class="form-group">
      <label>Target Recipient Email Address</label>
      <input type="email" id="test-email-target" class="form-input" placeholder="youremail@gmail.com" value="2ndsalviejomark2019@gmail.com"/>
    </div>

    <div class="form-group">
      <label>Select Email Template Type to Send</label>
      <select id="test-email-template" class="form-select">
        <option value="drip">✉️ Monthly Drip Encouragement Letter (Month 1)</option>
        <option value="otp">🔐 6-Digit OTP Account Verification Code</option>
        <option value="receipt">🧾 TCRP Reward Redemption Purchase Receipt</option>
      </select>
    </div>

    <button class="btn" id="btn-send-test-email" onclick="dispatchTestEmail()">🚀 Dispatch Selected Test Email</button>
  </div>
</div>

<script>
async function dispatchTestEmail() {
  const target = document.getElementById("test-email-target").value.trim();
  const template = document.getElementById("test-email-template").value;
  const btn = document.getElementById("btn-send-test-email");

  if (!target) {
    showToast("Please provide an email address.", "error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "⏳ Sending Email...";

  try {
    const res = await fetch("/api/main", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "test_email",
        email: target,
        template_type: template
      })
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`Success! ${template.toUpperCase()} email sent to ${target}`);
    } else {
      showToast(data.error || "Failed to dispatch email", "error");
    }
  } catch (err) {
    showToast("Network error: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "🚀 Dispatch Selected Test Email";
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initAppLayout('settings', 'Settings');
});
</script>
</body>
</html>
