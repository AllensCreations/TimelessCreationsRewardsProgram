<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCRP Rewards Items | Timeless Creations</title>
    <style>
        :root { --bg: #0a0a0f; --surface: #111118; --surface2: #181822; --border: rgba(255,255,255,0.08); --gold: #c9a84c; --gold2: #f0d080; --text: #e8e6f0; --muted: #716e88; --radius: 8px; }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
        .container { max-width: 860px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 1.3rem; color: var(--gold); margin: 0; }
        .back-link { font-size: 0.72rem; color: var(--muted); text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); }
        .product-name { font-size: 0.9rem; font-weight: bold; color: var(--text); }
        .product-price { font-size: 0.75rem; color: var(--gold); font-weight: bold; }
        .btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; font-size: 0.68rem; cursor: pointer; }
        .btn-edit:hover { border-color: var(--gold); color: var(--gold); }

        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .form-title { font-size: 0.95rem; font-weight: bold; color: var(--gold); margin-bottom: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 0.75rem; box-sizing: border-box; }
        .btn-save { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #0a0a0f; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <a href="/" class="back-link">← Back to Dashboard</a>
            <h1>TCRP Rewards Items & Carousel CMS</h1>
        </div>
    </div>

    <div class="product-grid" id="product-grid">
        <div style="color:var(--muted); font-size:0.75rem;">Loading products from Turso...</div>
    </div>

    <div class="form-card">
        <div class="form-title" id="form-heading">Add / Edit Reward Product</div>
        <input type="hidden" id="prod-id" value="">
        <div class="form-group">
            <label class="form-label">Product Name</label>
            <input type="text" id="prod-name" class="form-input" placeholder="e.g. Temple Keychain">
        </div>
        <div class="form-group">
            <label class="form-label">Cost in Points (Price)</label>
            <input type="number" id="prod-price" class="form-input" placeholder="e.g. 6">
        </div>
        <div class="form-group">
            <label class="form-label">Product Image URL</label>
            <input type="url" id="prod-img" class="form-input" placeholder="https://example.com/item.jpg">
        </div>
        <button class="btn-save" onclick="saveProduct()">💾 Save to Rewards Catalog</button>
    </div>
</div>

<script>
async function loadProducts() {
  try {
    const res = await fetch("/api/main?action=get_products");
    const data = await res.json();
    const grid = document.getElementById("product-grid");
    if (data.ok && data.products) {
      if (data.products.length === 0) {
        grid.innerHTML = '<div style="color:var(--muted); font-size:0.75rem;">No products found in catalog.</div>';
        return;
      }
      grid.innerHTML = data.products.map(p => `
        <div class="product-card">
          <img src="${p.image_url || 'https://i.postimg.cc/FFdrCNqq/Untitled56-20260820115353.png'}" class="product-img" alt="${p.name}">
          <div class="product-name">${p.name}</div>
          <div class="product-price">⭐ ${p.price || 0} PTS</div>
          <button class="btn-edit" onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit Item</button>
        </div>
      `).join('');
    }
  } catch(e) {
    console.error("Failed to load products", e);
  }
}

function editProduct(p) {
  document.getElementById("prod-id").value = p.id || "";
  document.getElementById("prod-name").value = p.name || "";
  document.getElementById("prod-price").value = p.price || 0;
  document.getElementById("prod-img").value = p.image_url || "";
  document.getElementById("form-heading").textContent = "Edit Product: " + p.name;
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

async function saveProduct() {
  const id = document.getElementById("prod-id").value;
  const name = document.getElementById("prod-name").value.trim();
  const price = parseInt(document.getElementById("prod-price").value, 10) || 0;
  const image_url = document.getElementById("prod-img").value.trim();

  if (!name) return alert("Product name is required.");

  try {
    const res = await fetch("/api/main", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "save_product", id, name, price, image_url })
    });
    const data = await res.json();
    if (data.ok) {
      alert("✅ Product saved successfully! Messenger carousel updated.");
      document.getElementById("prod-id").value = "";
      document.getElementById("prod-name").value = "";
      document.getElementById("prod-price").value = "";
      document.getElementById("prod-img").value = "";
      document.getElementById("form-heading").textContent = "Add / Edit Reward Product";
      loadProducts();
    } else {
      alert("Error: " + (data.error || "Failed to save product"));
    }
  } catch (err) {
    alert("Network error saving product.");
  }
}

window.addEventListener("DOMContentLoaded", loadProducts);
</script>

</body>
</html>
