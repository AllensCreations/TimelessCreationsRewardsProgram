<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Rewards Catalog | Timeless Creations</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/app.js"></script>
    <style>
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
      .modal-content { background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius); padding: 24px; max-width: 480px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

<div class="card" style="border-color: rgba(201,168,76,0.3); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
    <div style="font-size:0.75rem; color:var(--text); line-height:1.5; max-width:600px;">
        🤖 <strong>Messenger Bot Items:</strong> Click <strong>"+ Add New Reward"</strong> or <strong>"✏️ Edit"</strong> to modify products via popup modal. Edits occur instantly in memory and sync when clicking <strong>"💾 Save Changes"</strong>.
    </div>
    <button class="btn btn-gold" onclick="openProductModal()">+ Add New Reward</button>
</div>

<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; margin-bottom:24px;" id="products-grid">
    <div style="color:var(--muted); font-size:0.75rem;">Loading catalog...</div>
</div>

<!-- Modal Popup for Adding / Editing Reward Product -->
<div class="modal-overlay" id="product-modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <div style="font-family:'Syne',sans-serif; font-size:1.05rem; font-weight:bold; color:var(--gold);" id="modal-heading">Add Reward Item</div>
            <button onclick="closeProductModal()" style="background:none; border:none; color:var(--muted); font-size:1.2rem; cursor:pointer;">✕</button>
        </div>
        <input type="hidden" id="modal-prod-id">
        <div class="form-group">
            <label class="form-label">Reward Item Name</label>
            <input type="text" id="modal-prod-name" class="form-input" placeholder="e.g. Temple Keychain">
        </div>
        <div class="form-group">
            <label class="form-label">Cost in Points</label>
            <input type="number" id="modal-prod-price" class="form-input" placeholder="e.g. 6">
        </div>
        <div class="form-group">
            <label class="form-label">Image URL</label>
            <input type="url" id="modal-prod-img" class="form-input" placeholder="https://i.postimg.cc/.../item.png">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:18px;">
            <button class="btn btn-dark" onclick="closeProductModal()">Cancel</button>
            <button class="btn btn-gold" onclick="saveModalProduct()">Apply to List</button>
        </div>
    </div>
</div>

<div class="save-banner" id="save-banner" style="display:none;">
    <span style="font-size:0.72rem; color:var(--gold); font-weight:bold;">⚡ Unsaved local edits present</span>
    <button class="btn btn-gold" onclick="saveToTurso()">💾 Save Changes to Turso</button>
</div>

<script>
let localProducts = [];
let isDirty = false;

function markDirty() {
  isDirty = true;
  document.getElementById("save-banner").style.display = "flex";
}

async function loadData() {
  localProducts = LocalStore.get('products', []);
  if (localProducts.length === 0) {
    try {
      const res = await fetch("/api/main?action=get_products");
      const data = await res.json();
      if (data.ok) {
        localProducts = data.products || [];
        LocalStore.set('products', localProducts);
      }
    } catch(e){}
  }
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById("products-grid");
  if (!localProducts.length) {
    grid.innerHTML = '<div style="color:var(--muted); font-size:0.75rem;">No reward products found. Click "+ Add New Reward" above to add one!</div>';
    return;
  }
  grid.innerHTML = localProducts.map((p, idx) => `
    <div class="card" style="display:flex; flex-direction:column; gap:8px; margin-bottom:0;">
      <img src="${p.image_url || 'https://i.postimg.cc/FFdrCNqq/Untitled56-20260820115353.png'}" style="width:100%; height:130px; object-fit:cover; border-radius:6px; background:var(--surface2);" alt="${p.name}">
      <div style="font-weight:bold; font-size:0.85rem;">${p.name}</div>
      <div style="color:var(--gold); font-size:0.72rem; font-weight:bold;">⭐ ${p.price || 0} PTS</div>
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button class="btn btn-dark" style="flex:1;" onclick="openProductModal(${idx})">✏️ Edit</button>
        <button class="btn btn-red" onclick="deleteLocal(${idx})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function openProductModal(idx = null) {
  if (idx !== null) {
    const p = localProducts[idx];
    document.getElementById("modal-prod-id").value = idx;
    document.getElementById("modal-prod-name").value = p.name || "";
    document.getElementById("modal-prod-price").value = p.price || 0;
    document.getElementById("modal-prod-img").value = p.image_url || "";
    document.getElementById("modal-heading").textContent = "Edit Reward: " + p.name;
  } else {
    document.getElementById("modal-prod-id").value = "";
    document.getElementById("modal-prod-name").value = "";
    document.getElementById("modal-prod-price").value = "";
    document.getElementById("modal-prod-img").value = "";
    document.getElementById("modal-heading").textContent = "Add New Reward Item";
  }
  document.getElementById("product-modal").style.display = "flex";
}

function closeProductModal() {
  document.getElementById("product-modal").style.display = "none";
}

function saveModalProduct() {
  const idx = document.getElementById("modal-prod-id").value;
  const name = document.getElementById("modal-prod-name").value.trim();
  const price = parseInt(document.getElementById("modal-prod-price").value, 10) || 0;
  const image_url = document.getElementById("modal-prod-img").value.trim();

  if (!name) return alert("Reward item name is required.");

  if (idx !== "") {
    localProducts[idx] = { ...localProducts[idx], name, price, image_url };
  } else {
    localProducts.push({ id: Date.now(), name, price, image_url });
  }

  LocalStore.set('products', localProducts);
  closeProductModal();
  markDirty();
  renderProducts();
}

function deleteLocal(idx) {
  if (!confirm("Remove this item from the list?")) return;
  localProducts.splice(idx, 1);
  LocalStore.set('products', localProducts);
  markDirty();
  renderProducts();
}

async function saveToTurso() {
  const btn = document.querySelector("#save-banner .btn-gold");
  btn.textContent = "⏳ Syncing to Turso...";
  try {
    for (const p of localProducts) {
      await fetch("/api/main", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          action: "save_product", 
          name: p.name, 
          price: p.price, 
          image_url: p.image_url, 
          id: typeof p.id === 'number' && p.id < 1000000 ? p.id : null 
        })
      });
    }
    isDirty = false;
    document.getElementById("save-banner").style.display = "none";
    btn.textContent = "💾 Save Changes to Turso";
    alert("✅ Messenger rewards updated in Turso database successfully!");
  } catch(e) {
    alert("Network error saving to Turso.");
    btn.textContent = "💾 Save Changes to Turso";
  }
}

window.syncData = async () => {
  localStorage.removeItem('tcrp_products');
  await loadData();
  alert("Re-synced with Turso database.");
};

window.addEventListener("DOMContentLoaded", () => {
  initAppLayout('messengerbot', 'Messenger Bot Rewards');
  loadData();
});
</script>

</body>
</html>
