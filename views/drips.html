<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24-Month Drips & Media Hub | Timeless Creations</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/app.js"></script>
    <style>
      .toggle-wrap { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 12px; }
      .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; cursor: pointer; inset: 0; background-color: #2a2a38; transition: .3s; border-radius: 24px; border: 1px solid var(--border); }
      .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--muted); transition: .3s; border-radius: 50%; }
      input:checked + .slider { background-color: var(--gold-dim); border-color: var(--gold); }
      input:checked + .slider:before { transform: translateX(20px); background-color: var(--gold); }

      .img-picker-card {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        text-align: center;
      }
      .picker-thumb-wrap {
        width: 100%;
        aspect-ratio: 1 / 1;
        max-width: 110px;
        background: #08080d;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .picker-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .picker-btn-group { display: flex; gap: 4px; width: 100%; }
      .picker-btn-group button { flex: 1; padding: 5px 4px; font-size: 0.65rem; min-height: 32px; }

      .tab-content { display: none !important; }
      .tab-content.active { display: block !important; }

      .preview-wrapper { width: 100%; max-width: 480px; margin: 0 auto; background: #12121a; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 20px; box-sizing: border-box; }
      .preview-frame { width: 100%; background: #ffffff; border: 1px solid #e0d6bc; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

      .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; overflow-y: auto; padding: 10px 0; max-height: 50vh; }
      .modal-img-card { width: 100%; aspect-ratio: 1/1; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: pointer; background: #08080d; display: flex; align-items: center; justify-content: center; }
      .modal-img-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
</head>
<body>

<div class="container">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-color:var(--border-gold);">

  <div id="tab-html" class="tab-content">

</div>

</div>

let currentTargetInputId = null;
let currentTargetThumbId = null;

function getCalendarMonthLabel(monthIndex) {
  const calendarNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const idx = (Number(monthIndex) - 1) % 12;
  return calendarNames[idx];
}

function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

function initSelector() {
  const sel = document.getElementById("month-selector");
  sel.innerHTML = "";
  for (let i = 1; i <= 24; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${getCalendarMonthLabel(i)} (M${i})`;
    sel.appendChild(opt);
  }
}

async function openGalleryModal(inputId, thumbId) {
  currentTargetInputId = inputId;
  currentTargetThumbId = thumbId;
  document.getElementById("gallery-picker-modal").style.display = "flex";
  
  let items = LocalStore.get('tcrp_cdn_gallery', null);
  if (!items) {
    try {
      const res = await fetch('/api/main?action=cdn_list').then(r => r.json());
      items = res.gallery || res.items || [];
      LocalStore.set('tcrp_cdn_gallery', items);
    } catch (_) { items = []; }
  }
  renderModalGrid(items);
}

function closeGalleryModal() { document.getElementById("gallery-picker-modal").style.display = "none"; }

function renderModalGrid(items) {
  const grid = document.getElementById("modal-grid-container");
  if (!items || !items.length) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:var(--muted); font-size:0.75rem;">No images in Gallery.</div>';
    return;
  }
  grid.innerHTML = items.map(it => `
    <div class="modal-img-card" onclick="selectImage('${it.direct_url}')" title="${it.filename}">
      <img src="${it.direct_url}" alt="${it.filename}" loading="lazy">
    </div>
  `).join('');
}

function filterModalGrid(q) {
  const clean = (q || '').toLowerCase().trim();
  const items = LocalStore.get('tcrp_cdn_gallery', []);
  const filtered = items.filter(i => (i.filename || '').toLowerCase().includes(clean));
  renderModalGrid(filtered);
}

function selectImage(url) {
  if (currentTargetInputId) document.getElementById(currentTargetInputId).value = url;
  if (currentTargetThumbId) document.getElementById(currentTargetThumbId).src = url;
  closeGalleryModal();
  onLiveEdit();
  showToast("Image selected!");
}

function revertImage(inputId, thumbId, defaultUrl) {
  document.getElementById(inputId).value = defaultUrl;
  document.getElementById(thumbId).src = defaultUrl;
  onLiveEdit();
}

async function fetchFromTurso() {
  try {
    const [dripRes, promoRes] = await Promise.all([
      fetch("/api/main?action=get_drips").then(r => r.json()).catch(() => ({})),
      fetch("/api/main?action=get_promo_codes").then(r => r.json()).catch(() => ({}))
    ]);

    if (dripRes.ok && Array.isArray(dripRes.drips)) {
      dripRes.drips.forEach(d => {
        liveDripMap[Number(d.month)] = {
          month: Number(d.month),
          subject: d.subject || `Monthly Encouragement (${getCalendarMonthLabel(d.month)}) • Timeless Creations`,
          theme: d.theme || "Elder Jeffrey R. Holland",
          scripture: d.scripture || "Trust in the Lord with all thine heart; and lean not unto thine own understanding.",
          message: d.message || `May your faith be strengthened as you serve and invite others during ${getCalendarMonthLabel(d.month)}.`,
          highlight_img: d.highlight_img || "",
          highlight_label: d.highlight_label || "",
          highlight_img_2: d.highlight_img_2 || "",
          highlight_label_2: d.highlight_label_2 || "",
          custom_html: d.custom_html || ""
        };
      });
    }

    if (promoRes.ok && Array.isArray(promoRes.promo_codes) && promoRes.promo_codes.length > 0) {
      latestPromo = promoRes.promo_codes[0];
    } else {
      latestPromo = null;
    }
  } catch(e) {}
}

function onSelectMonth(m) {
  currentMonth = parseInt(m, 10);
  const label = getCalendarMonthLabel(currentMonth);
  document.getElementById("unsaved-month-label").textContent = `${label} (M${currentMonth})`;

  const data = liveDripMap[currentMonth] || {
    month: currentMonth,
    subject: `Monthly Encouragement (${label}) • Timeless Creations`,
    theme: "Elder Jeffrey R. Holland",
    scripture: "Trust in the Lord with all thine heart; and lean not unto thine own understanding.",
    message: `May your faith be strengthened as you serve and invite others during ${label}.`,
    highlight_img: "",
    highlight_label: "",
    highlight_img_2: "",
    highlight_label_2: "",
    custom_html: ""
  };

  document.getElementById("inp-subject").value = data.subject || "";
  document.getElementById("inp-theme").value = data.theme || "";
  document.getElementById("inp-msg").value = data.message || "";
  document.getElementById("inp-quote").value = data.scripture || "";
  document.getElementById("inp-custom-html").value = data.custom_html || "";

  if ((data.highlight_label && data.highlight_label.trim() !== "") || (data.highlight_label_2 && data.highlight_label_2.trim() !== "")) {
    document.getElementById("inp-highlight-toggle").checked = true;
    document.getElementById("inp-highlight-name").value = data.highlight_label || "";
    document.getElementById("inp-highlight-img").value = data.highlight_img || "https://lh3.googleusercontent.com/u/0/d/1F7Yb0OzuCmPO2LyZ0cMoaTM4d4rs5RFE";
    document.getElementById("thumb-hl-1").src = data.highlight_img || "https://lh3.googleusercontent.com/u/0/d/1F7Yb0OzuCmPO2LyZ0cMoaTM4d4rs5RFE";
    document.getElementById("inp-highlight-name-2").value = data.highlight_label_2 || "";
    document.getElementById("inp-highlight-img-2").value = data.highlight_img_2 || "https://lh3.googleusercontent.com/u/0/d/101jY71PjxCwiuNznTgn7Xyc0HoXwB3WQ";
    document.getElementById("thumb-hl-2").src = data.highlight_img_2 || "https://lh3.googleusercontent.com/u/0/d/101jY71PjxCwiuNznTgn7Xyc0HoXwB3WQ";
  } else {
    document.getElementById("inp-highlight-toggle").checked = false;
    document.getElementById("inp-highlight-name").value = "";
    document.getElementById("inp-highlight-name-2").value = "";

  const badge = document.getElementById("badge-template-status");
  if (data.custom_html && data.custom_html.trim() !== "") {

    badge.style.color = "var(--muted)";

  renderPreview();

function onLiveEdit() {
  const isHigh = document.getElementById("inp-highlight-toggle").checked;

  liveDripMap[currentMonth] = {
    month: currentMonth,

function buildCombinedRewardSectionHtml(points = 2, products = [], activePromo = null) {

  const validProducts = Array.isArray(products) ? products : [];
  const affordable = validProducts.filter(p => Number(p.price) <= userPoints);

  let promoSnippetHtml = "";
  if (activePromo && activePromo.code && activePromo.code.trim() !== "") {
    promoSnippetHtml = `
      <div style="margin: 0 0 14px 0; padding: 12px 14px; background-color: #fff9e6; border: 1.5px dashed #c9a84c; border-radius: 6px; text-align: center;">
        <span style="font-family: 'Helvetica', Arial, sans-serif; font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: #8b1a1a; font-weight: bold; display: block; margin-bottom: 3px;">
          🎟️ Exclusive Monthly Freebie Promo
        </span>
        <div style="font-size: 12px; color: #1a1a1a; margin-bottom: 5px;">
          Claim <strong>+${activePromo.points || 1} Free Reward Points</strong> right now!
        </div>
        <div style="font-family: monospace; font-size: 12.5px; font-weight: bold; background: #1a1a1a; color: #d4c197; padding: 5px 12px; border-radius: 4px; display: inline-block; letter-spacing: 1px;">
          /redeem ${activePromo.code}
        </div>
        <div style="font-size: 9.5px; color: #777; margin-top: 5px;">
          Type this in our Messenger chat to claim bonus points instantly!
        </div>
      </div>
    `;
  }

  let affordableHtml = "";
  if (affordable.length > 0) {
    affordableHtml = `
      <div style="font-size: 11px; font-weight: bold; color: #1a1a1a; margin-bottom: 8px; text-align: left;">
        🎁 You can claim these reward items right now:
      </div>
      <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 12px;">
        ${affordable.map(item => `
          <tr>
            <td style="padding: 6px; background: #ffffff; border: 1px solid #e0d6bc; border-radius: 4px; margin-bottom: 6px;">
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td width="36" valign="middle">
                    <img src="${item.image_url || 'https://i.postimg.cc/FFdrCNqq/Untitled56-20260820115353.png'}" style="width: 32px; height: 32px; aspect-ratio: 1/1; object-fit: cover; border-radius: 3px; display: block;">
                  </td>
                  <td style="padding-left: 8px; text-align: left;" valign="middle">
                    <div style="font-weight: bold; font-size: 11px; color: #1a1a1a;">${item.name}</div>
                    <div style="font-size: 9.5px; color: #8c7e5d; font-weight: bold;">⭐ ${item.price} Points</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr><td height="4"></td></tr>
        `).join('')}
      </table>
    `;
  }

  let goalHtml = "";
  if (validProducts.length > 0) {
    const sorted = [...validProducts].sort((a, b) => Number(a.price) - Number(b.price));
    const nearestItem = sorted.find(p => Number(p.price) > userPoints) || sorted[0];
    const needed = Math.max(1, (Number(nearestItem.price) || 6) - userPoints);

    goalHtml = `
      <div style="background: #ffffff; border: 1px solid #e0d6bc; border-radius: 6px; padding: 12px; text-align: center; margin-bottom: 10px;">
        <span style="font-size: 9px; color: #8b1a1a; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-bottom: 6px;">
          🎯 Nearest Reward Goal:
        </span>
        <img src="${nearestItem.image_url || 'https://i.postimg.cc/FFdrCNqq/Untitled56-20260820115353.png'}" style="width: 50px; height: 50px; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; display: block; margin: 0 auto 6px auto; border: 1px solid #d4c197;">
        <div style="font-weight: bold; font-size: 11.5px; color: #1a1a1a;">${nearestItem.name} (${nearestItem.price} PTS)</div>
        <div style="font-size: 11px; color: #8c7e5d; margin-top: 4px; font-weight: bold;">⚡ Only <strong>${needed} more point${needed > 1 ? 's' : ''}</strong> needed!</div>
      </div>
    `;
  }

  return `
    <div style="margin: 24px 0; padding: 18px 14px; background-color: #fffcf5; border: 1px solid #c9a84c; border-radius: 6px; text-align: center;">
      <div style="font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; font-weight: bold; color: #8b1a1a; margin-bottom: 4px;">

      ${goalHtml}

      <a href="https://m.me/TimelessCreationsRP" target="_blank" style="display: block; width: 90%; margin: 12px auto 0; padding: 12px 16px; background-color: #1a1a1a; color: #d4c197 !important; text-decoration: none; font-family: 'Helvetica', Arial, sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; border-radius: 4px; box-sizing: border-box;">
        Redeem Free Rewards via Messenger
      </a>
    </div>
  `;

function renderPreview() {
  const data = liveDripMap[currentMonth] || {};
  const monthLabel = getCalendarMonthLabel(currentMonth);
  const iframe = document.getElementById("preview-iframe");
  if (!iframe) return;

  const name = "Elder Smith";
  const message = (document.getElementById("inp-msg").value || data.message || "").replace(/\n/g, "<br>");
  const cleanedQuote = (document.getElementById("inp-quote").value || data.scripture || "Trust in the Lord with all thine heart; and lean not unto thine own understanding.").replace(/^["'“](.*)["'”]$/, '$1').trim();
  const theme = document.getElementById("inp-theme").value || data.theme || "Elder Jeffrey R. Holland";
  const points = 2;

  const isHigh = document.getElementById("inp-highlight-toggle").checked;
  const h1Name = document.getElementById("inp-highlight-name").value.trim();
  const h1Img = document.getElementById("inp-highlight-img").value.trim();
  const h2Name = document.getElementById("inp-highlight-name-2").value.trim();
  const h2Img = document.getElementById("inp-highlight-img-2").value.trim();

  const items = [];
  if (h1Name) items.push({ name: h1Name, img: h1Img || "https://lh3.googleusercontent.com/u/0/d/1F7Yb0OzuCmPO2LyZ0cMoaTM4d4rs5RFE" });
  if (h2Name) items.push({ name: h2Name, img: h2Img || "https://lh3.googleusercontent.com/u/0/d/101jY71PjxCwiuNznTgn7Xyc0HoXwB3WQ" });

  let highlightHtml = '';
  if (items.length > 0) {
    highlightHtml = `
      <span style="font-family: 'Helvetica', Arial, sans-serif; font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: #8b1a1a; font-weight: bold; display: block; margin-bottom: 8px; text-align: center;">⭐ Product${items.length > 1 ? 's' : ''} of the Month</span>
      <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
          ${items.map((it, idx) => `
            <td align="center" width="${items.length === 2 ? '48%' : '100%'}" valign="top">
              <img src="${it.img}" style="width: 100%; max-width: 120px; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; border: 1px solid #c9a84c; display: block; margin: 0 auto 4px auto;" alt="${it.name}">
              <div style="font-family: 'Helvetica', Arial, sans-serif; font-size: 9.5px; font-weight: bold; color: #1a1a1a;">${it.name}</div>
            </td>
            ${idx === 0 && items.length === 2 ? '<td width="4%"></td>' : ''}
          `).join('')}
        </tr>
      </table>
    `;
  }

  let catalogProducts = LocalStore.get('temp_products', [
    { name: "Wooden Nametag", price: 6, image_url: "https://lh3.googleusercontent.com/u/0/d/1F7Yb0OzuCmPO2LyZ0cMoaTM4d4rs5RFE" },
    { name: "Temple Keychain", price: 6, image_url: "https://i.postimg.cc/FFdrCNqq/Untitled56-20260820115353.png" }
  ]);
  const rewardSectionHtml = buildCombinedRewardSectionHtml(points, catalogProducts, latestPromo);

  let sourceTemplate = (document.getElementById("inp-custom-html").value.trim() !== "") 
    ? document.getElementById("inp-custom-html").value 
    : masterTemplateCode;

  let finalHtml = sourceTemplate
    .replace(/{{MONTH}}/g, monthLabel)
    .replace(/{{NAME}}/g, name)
    .replace(/{{MESSAGE}}/g, message)
    .replace(/{{SCRIPTURE}}/g, cleanedQuote)
    .replace(/{{THEME}}/g, theme)
    .replace(/{{POINTS}}/g, String(points))
    .replace(/{{HIGHLIGHT_DISPLAY}}/g, isHigh && items.length > 0 ? "display:block" : "display:none")
    .replace(/{{HIGHLIGHT_ITEMS_HTML}}/g, highlightHtml)
    .replace(/{{REWARD_SECTION_HTML}}/g, rewardSectionHtml)
    .replace(/{{ESS1_NAME}}/g, document.getElementById("inp-ess1-name").value.trim())
    .replace(/{{ESS1_IMG}}/g, document.getElementById("inp-img-ess1").value.trim())
    .replace(/{{ESS2_NAME}}/g, document.getElementById("inp-ess2-name").value.trim())
    .replace(/{{ESS2_IMG}}/g, document.getElementById("inp-img-ess2").value.trim());

  for (let i = 1; i <= 9; i++) {
    const gImg = document.getElementById(`inp-grid-${i}`)?.value || "";
    finalHtml = finalHtml.replace(new RegExp(`{{GRID${i}}}`, 'g'), gImg);
  }

  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(finalHtml);
  doc.close();
}

async function saveActiveMonth(sectionName = 'global') {
  const data = liveDripMap[currentMonth] || {};
  const label = getCalendarMonthLabel(currentMonth);

  try {
    const res = await fetch("/api/main", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "save_drip",
        month: currentMonth,
        subject: data.subject,
        theme: data.theme,
        scripture: data.scripture,
        message: data.message,
        highlight_img: data.highlight_img,
        highlight_label: data.highlight_label,
        highlight_label_2: data.highlight_label_2,
        highlight_img_2: data.highlight_img_2,
        custom_html: data.custom_html
      })
    }).then(r => r.json());

    if (res.ok) {
      document.getElementById("save-banner").style.display = "none";
      showToast(`Saved for ${label}!`);
    } else {
      showToast(res.error || "Failed to save.", "error");
    }
  } catch(e) {
    showToast("Network error saving to Turso.", "error");
  }
}
