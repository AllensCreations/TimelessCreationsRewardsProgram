<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Messenger Inbox</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --blue:#5c8de0; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;height:100vh;overflow:hidden;padding:16px;}
  .container{max-width:1400px;height:calc(100vh - 32px);margin:0 auto;display:flex;flex-direction:column;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.6rem;color:var(--gold);}
  .nav-links{display:flex;gap:10px;align-items:center;}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}

  .inbox-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;flex:1;overflow:hidden;}
  @media(max-width:800px){.inbox-layout{grid-template-columns:1fr;}}

  .sidebar-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-y:auto;display:flex;flex-direction:column;}
  .chat-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.2s;}
  .chat-item:hover, .chat-item.active{background:var(--surface2);border-left:3px solid var(--gold);}
  .chat-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.8rem;color:var(--text);margin-bottom:3px;}
  .chat-preview{font-size:0.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .chat-pane{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;}
  .chat-pane-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface2);font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;color:var(--gold);}
  .messages-area{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:0.75rem;}
  .message-bubble{max-width:70%;padding:10px 14px;border-radius:8px;line-height:1.4;}
  .message-bubble.incoming{background:var(--surface2);border:1px solid var(--border);align-self:flex-start;}
  .message-bubble.outgoing{background:var(--gold-dim);border:1px solid rgba(201,168,76,0.3);color:var(--gold2);align-self:flex-end;}

  .chat-input-bar{padding:14px;border-top:1px solid var(--border);background:var(--surface2);display:flex;gap:10px;}
  .form-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.75rem;outline:none;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0f;border:none;padding:10px 20px;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Messenger Live Chat Inbox</h1>
      <p style="font-size:0.65rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">Meta Graph API Active Conversations</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
      <a href="/settings.html" class="btn-link">⚙️ Control Room</a>
    </div>
  </header>

  <div class="inbox-layout">
    <!-- Conversation List -->
    <div class="sidebar-list" id="conversations-list">
      <div style="padding:20px;color:var(--muted);text-align:center;">Loading conversations...</div>
    </div>

    <!-- Active Chat Pane -->
    <div class="chat-pane">
      <div class="chat-pane-header" id="active-chat-title">Select a Conversation</div>
      <div class="messages-area" id="messages-container">
        <div style="color:var(--muted);text-align:center;margin:auto;">Select a missionary chat from the left sidebar to view messages.</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="reply-input" class="form-input" placeholder="Type a reply..." onkeydown="if(event.key==='Enter')sendReply()"/>
        <button class="btn" onclick="sendReply()">Send Reply</button>
      </div>
    </div>
  </div>
</div>

<script>
let activePsid = null;
let conversations = [];

async function loadInbox() {
  try {
    const res = await fetch('/api/inbox');
    const data = await res.json();
    if (data.ok) {
      conversations = data.conversations || [];
      renderConversations();
    }
  } catch (err) {
    console.error(err);
  }
}

function renderConversations() {
  const list = document.getElementById('conversations-list');
  if (!conversations.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center;font-size:0.7rem;">No conversations recorded yet. When missionaries message your Facebook Page, they will appear here.</div>';
    return;
  }

  list.innerHTML = conversations.map(c => `
    <div class="chat-item ${activePsid === c.psid ? 'active' : ''}" onclick="selectChat('${c.psid}', '${c.name || 'Missionary'}')">
      <div class="chat-name">${c.name || 'Missionary PSID: ' + c.psid.slice(-6)}</div>
      <div class="chat-preview">${c.last_message || 'Tap to view conversation'}</div>
    </div>
  `).join('');
}

async function selectChat(psid, name) {
  activePsid = psid;
  document.getElementById('active-chat-title').textContent = name;
  renderConversations();

  const res = await fetch(`/api/inbox?psid=${psid}`);
  const data = await res.json();
  if (data.ok) {
    renderMessages(data.messages || []);
  }
}

function renderMessages(msgs) {
  const container = document.getElementById('messages-container');
  if (!msgs.length) {
    container.innerHTML = '<div style="color:var(--muted);text-align:center;margin:auto;">No messages in this thread.</div>';
    return;
  }
  container.innerHTML = msgs.map(m => `
    <div class="message-bubble ${m.sender === 'page' ? 'outgoing' : 'incoming'}">
      ${m.text}
    </div>
  `).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendReply() {
  const input = document.getElementById('reply-input');
  const text = input.value.trim();
  if (!text || !activePsid) return;

  const res = await fetch('/api/inbox', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ psid: activePsid, text })
  });
  const data = await res.json();
  if (data.ok) {
    input.value = '';
    selectChat(activePsid, document.getElementById('active-chat-title').textContent);
  }
}

window.addEventListener('DOMContentLoaded', loadInbox);
</script>
</body>
</html>
