<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Command Center | Timeless Creations</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js"></script>
  <style>
    .hero-banner {
      background: linear-gradient(135deg, rgba(201,168,76,0.12) 0%, rgba(24,27,42,0.85) 100%);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media(min-width: 768px) {
      .hero-banner { flex-direction: row; justify-content: space-between; align-items: center; padding: 26px; }
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 14px;
    }
    .cal-day-header { font-size: 0.62rem; text-align: center; color: var(--muted); text-transform: uppercase; font-weight: 700; padding: 4px 0; }
    .cal-cell {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 48px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .cal-cell.today { border-color: var(--gold); box-shadow: 0 0 10px rgba(201,168,76,0.2) inset; }
    .cal-cell.has-activity { background: rgba(201,168,76,0.12); border-color: rgba(201,168,76,0.4); }
    .cal-num { font-size: 0.7rem; color: var(--muted); font-weight: bold; }
    .cal-count { font-size: 0.6rem; font-weight: bold; color: var(--gold); align-self: flex-end; }
  </style>
</head>
<body>

<div class="container">
  <div class="hero-banner">
    <div>
      <h1 style="color:var(--gold); font-size:1.35rem; margin-bottom:4px;">Welcome back, Administrator ✨</h1>
      <p style="font-size:0.78rem; color:var(--muted);">Missionary encouragement and reward dispatch overview.</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <a href="/gallery.html" class="btn btn-dark" style="font-size:0.75rem; flex:1; min-width:130px;">🖼️ Gallery</a>
      <a href="/invoicing.html" class="btn btn-gold" style="font-size:0.75rem; flex:1; min-width:130px;">🧾 Invoicing</a>
    </div>
  </div>

  <!-- Primary Stat Cards -->
  <div class="stat-grid">
    <div class="stat-card gold">
      <div class="stat-label">Total Missionaries</div>
      <div class="stat-val" id="stat-missionaries">--</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Sent Today</div>
      <div class="stat-val" id="stat-sent-today" style="color:var(--green);">0</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">Sent This Month</div>
      <div class="stat-val" id="stat-sent-month" style="color:var(--blue);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Reward Points</div>
      <div class="stat-val" id="stat-points">--</div>
    </div>
  </div>

  <!-- Heatmap Section -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; flex-wrap:wrap; gap:8px;">
      <div>
        <div style="font-family:'Syne',sans-serif; font-size:0.95rem; font-weight:bold; color:var(--gold);">Monthly Drip Dispatch Heatmap</div>
        <div style="font-size:0.68rem; color:var(--muted);">Visual distribution of emails sent out this month.</div>
      </div>
      <span id="cal-month-name" style="font-size:0.72rem; color:#fff; font-weight:bold; background:var(--surface2); padding:4px 10px; border-radius:6px; border:1px solid var(--border);"></span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>
</div>

<script>
let dashboardState = { dailyStats: {} };

function renderFromCache() {
  const cachedPayload = LocalStore.get('stats_payload', null);
  if (!cachedPayload) { triggerGlobalRefresh(); return; }

  const s = cachedPayload.stats || {};
  document.getElementById("stat-missionaries").textContent = (s.total_missionaries || 0).toLocaleString();
  document.getElementById("stat-points").textContent = (s.circulating_points || 0).toLocaleString();
  document.getElementById("stat-sent-today").textContent = (s.emails_today || 0).toLocaleString();
  document.getElementById("stat-sent-month").textContent = (s.emails_month || 0).toLocaleString();

  dashboardState.dailyStats = cachedPayload.daily_stats || {};
  renderCalendar();
}

function renderCalendar() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  
  const monthEl = document.getElementById('cal-month-name');
  if (monthEl) monthEl.textContent = now.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

  const container = document.getElementById('calendar-grid');
  if (!container) return;
  container.innerHTML = '';

  const daysOfWeek = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  daysOfWeek.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-header';
    el.textContent = d;
    container.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();
  const todayDate = now.getDate();

  for (let i = 0; i < firstDay; i++) {
    const emptyCell = document.createElement('div');
    emptyCell.style.opacity = '0.04';
    emptyCell.className = 'cal-cell';
    container.appendChild(emptyCell);
  }

  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement('div');
    const dayStr = String(day).padStart(2, '0');
    const monthStr = String(month + 1).padStart(2, '0');
    const fullDateKey = `${year}-${monthStr}-${dayStr}`;

    const count = dashboardState.dailyStats[fullDateKey] || 0;
    cell.className = `cal-cell ${day === todayDate ? 'today' : ''} ${count > 0 ? 'has-activity' : ''}`;
    cell.innerHTML = `<div class="cal-num">${day}</div>${count > 0 ? `<div class="cal-count">✉${count}</div>` : ''}`;
    container.appendChild(cell);
  }
}

window.addEventListener("tcrp:data-synced", renderFromCache);
window.addEventListener("DOMContentLoaded", () => {
  initAppLayout('dashboard', 'Dashboard');
  renderFromCache();
});
</script>
</body>
</html>
