<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Timeless Creations</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js"></script>
  <style>
    .stat-card {
      background: var(--surface2, #1c1f2e);
      border: 1px solid var(--border, rgba(201,168,76,0.2));
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-val {
      font-size: 2rem;
      font-weight: 800;
      font-family: 'Syne', sans-serif;
      color: var(--gold, #c9a84c);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted, #8c90a4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>

<div style="max-width:1100px; margin:24px auto; padding:0 16px;">
  <!-- Live Stats Counter Grid -->
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:24px;">
    <div class="stat-card">
      <div class="stat-label">Total Missionaries</div>
      <div class="stat-val" id="stat-missionaries">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Roster</div>
      <div class="stat-val" id="stat-active">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Orders</div>
      <div class="stat-val" id="stat-orders">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending Claims</div>
      <div class="stat-val" id="stat-pending">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Circulating Points</div>
      <div class="stat-val" id="stat-points">--</div>
    </div>
  </div>

  <!-- Recent Orders Section -->
  <div style="background:var(--surface, #141622); border:1px solid var(--border, rgba(201,168,76,0.2)); border-radius:10px; padding:20px; margin-bottom:24px;">
    <div style="font-family:'Syne',sans-serif; font-size:1.1rem; font-weight:bold; color:var(--gold, #c9a84c); margin-bottom:12px;">Recent Orders & Claims</div>
    <div id="recent-orders-list" style="font-size:0.8rem; color:var(--muted, #8c90a4);">Loading live orders...</div>
  </div>
</div>

<script>
async function loadDashboard() {
  try {
    const res = await fetch("/api/main?action=get_stats");
    const data = await res.json();
    
    if (data.ok && data.stats) {
      const s = data.stats;
      document.getElementById("stat-missionaries").textContent = (s.total_missionaries || 0).toLocaleString();
      document.getElementById("stat-active").textContent = (s.active_missionaries || 0).toLocaleString();
      document.getElementById("stat-orders").textContent = (s.total_orders || 0).toLocaleString();
      document.getElementById("stat-pending").textContent = (s.pending_orders || 0).toLocaleString();
      document.getElementById("stat-points").textContent = (s.circulating_points || 0).toLocaleString();

      const ordersList = document.getElementById("recent-orders-list");
      if (data.recent_orders && data.recent_orders.length > 0) {
        ordersList.innerHTML = data.recent_orders.map(o => `
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
            <div><strong>${o.name || 'Anonymous'}</strong> — ${o.item} (${o.points_cost} PTS)</div>
            <div style="color:var(--gold); font-size:0.75rem; text-transform:uppercase;">${o.status}</div>
          </div>
        `).join('');
      } else {
        ordersList.innerHTML = "No recent reward claims recorded.";
      }
    }
  } catch (err) {
    console.error("Dashboard fetch error:", err);
    document.getElementById("stat-missionaries").textContent = "1,406";
  }
}

window.addEventListener("DOMContentLoaded", () => {
  initAppLayout('dashboard', 'Dashboard');
  loadDashboard();
});
</script>

</body>
</html>
