<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Referral Leaderboard & Milestones</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --blue:#5c8de0; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:24px;min-height:100vh;}
  .container{max-width:1000px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:16px;flex-wrap:wrap;gap:12px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.8rem;color:var(--gold);}
  .nav-links{display:flex;gap:10px;align-items:center;}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .leaderboard-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
  .rank-badge{font-family:'Syne',sans-serif;font-weight:bold;font-size:0.85rem;color:var(--gold);width:30px;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Referral Champions &amp; Leaderboard</h1>
      <p style="font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">Top Missionaries by Points &amp; Advocacy</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
      <a href="/settings.html" class="btn-link">⚙️ Control Room</a>
    </div>
  </header>

  <div class="card">
    <h3 style="font-family:'Syne',sans-serif;font-size:1rem;color:var(--gold);margin-bottom:16px;">🏆 Top Referral Advocates</h3>
    <div id="leaderboard-list">Loading champions...</div>
  </div>
</div>

<script>
async function init() {
  try {
    const res = await fetch('/api/leaderboard');
    const data = await res.json();
    if (data.ok) {
      renderLeaderboard(data.champions || []);
    }
  } catch (err) {
    document.getElementById('leaderboard-list').innerHTML = '<div style="color:var(--red);">Failed to load leaderboard.</div>';
  }
}

function renderLeaderboard(champions) {
  const c = document.getElementById('leaderboard-list');
  if (!champions.length) { c.innerHTML = '<div style="color:var(--muted);font-size:0.75rem;">No missionaries found.</div>'; return; }
  
  c.innerHTML = champions.map((m, idx) => `
    <div class="leaderboard-row">
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="rank-badge">#${idx + 1}</span>
        <div>
          <strong style="font-family:'Syne',sans-serif;font-size:0.85rem;">${m.name}</strong>
          <div style="font-size:0.65rem;color:var(--muted);">Code: ${m.referral_code || 'TCRP'}</div>
        </div>
      </div>
      <span style="color:var(--gold);font-weight:bold;font-family:'Syne',sans-serif;font-size:0.9rem;">${m.points} Pts</span>
    </div>
  `).join('');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
