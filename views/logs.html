<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs | Timeless Creations</title>
    <style>
        :root { --bg: #f9f7f2; --surface: #ffffff; --surface2: #fdfaf3; --text: #1a1a1a; --muted: #78716c; --gold: #c9a84c; --border: #e0d6bc; }
        body { font-family: 'Garamond', 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        h1 { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; color: var(--text); border-bottom: 2px solid var(--gold); padding-bottom: 12px; margin-top: 0; font-size: 24px; }
        .back-link { display: inline-block; margin-bottom: 20px; font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); text-decoration: none; }
        .log-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .log-table th, .log-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
        .log-table th { background: var(--surface2); font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
        .badge-info { background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; font-family: Helvetica, sans-serif; }
        .badge-error { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; font-family: Helvetica, sans-serif; }
    </style>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js"></script>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← Back to Dashboard</a>
    <h1>System Logs (Max 50)</h1>
    
    <div style="overflow-x: auto;">
        <table class="log-table">
            <thead>
                <tr>
                    <th>Time Stamp</th>
                    <th>Level</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="logs-tbody">
                <tr><td colspan="3" style="text-align:center; color:var(--muted);">Loading system logs...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadLogs() {
  try {
    const res = await fetch("/api/dashboard-data");
    const data = await res.json();
    const tbody = document.getElementById("logs-tbody");
    
    if (data.ok && data.logs) {
      const recentLogs = data.logs.slice(0, 50); // Max cap of 50
      if (recentLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--muted);">No logs recorded yet.</td></tr>';
        return;
      }
      tbody.innerHTML = recentLogs.map(l => `
        <tr>
          <td style="white-space: nowrap; color: var(--muted); font-size: 12px;">${l.createdAt || l.created_at || '—'}</td>
          <td><span class="${(l.level || 'INFO').toUpperCase() === 'ERROR' ? 'badge-error' : 'badge-info'}">${l.level || 'INFO'}</span></td>
          <td style="word-break: break-all;">${l.message || ''}</td>
        </tr>
      `).join('');
    }
  } catch (e) {
    console.error("Failed to load logs", e);
  }
}
window.addEventListener("DOMContentLoaded", loadLogs);
</script>

</body>
</html>
