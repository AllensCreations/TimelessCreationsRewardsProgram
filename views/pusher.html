<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Add Missionaries | Timeless Creations</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
<style>
  .manual-card-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  @media(min-width: 768px) {
    .manual-card-row { display: grid; grid-template-columns: 1.3fr 1.1fr 1.8fr 40px; align-items: center; }
  }
  .dropzone {
    border: 2px dashed var(--border-gold);
    border-radius: var(--radius-sm);
    padding: 24px 16px;
    text-align: center;
    background: var(--surface2);
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2 style="color:var(--gold); font-size:1.25rem;">➕ Add Missionaries to Roster</h2>
    <p style="font-size:0.72rem; color:var(--muted); margin-top:2px;">Bulk register missionaries or import cohort CSV batches.</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Target Cohort / Batch Month</label>
      <input type="text" id="global-batch-input" class="form-input" value="August 2026"/>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:0.95rem; color:var(--gold); margin-bottom:8px;">Manual Batch Registration</h3>
    <div id="manual-rows"></div>
    <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
      <button class="btn btn-secondary" onclick="addManualRow()" style="flex:1;">+ Add Row</button>
      <button class="btn btn-gold" id="push-manual-btn" onclick="pushManualEntries()" style="flex:2;">🚀 Push to Database</button>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:0.95rem; color:var(--gold); margin-bottom:8px;">Upload CSV File</h3>
    <div class="dropzone" onclick="document.getElementById('csv-file').click()">
      <span id="file-label">📁 Tap to select CSV file</span>
      <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="handleFileSelect(event)"/>
    </div>
    <button class="btn btn-gold" id="push-csv-btn" style="display:none; width:100%; margin-top:12px;" onclick="pushCsvEntries()">🚀 Push CSV to Database</button>
  </div>
</div>

<script>
let parsedCsvData = [];

function toTitleCase(str) {
  if (!str) return '';
  return str.toLowerCase().replace(/(?:^|\s|-)\S/g, char => char.toUpperCase()).trim();
}

function sanitizeEmail(email) {
  if (!email) return '';
  let clean = email.trim().toLowerCase();
  if (clean && !clean.includes('@')) clean += '@missionary.org';
  return clean;
}

function autoGenerateEmail(row) {
  const emailInput = row.querySelector('.m-email');
  if (emailInput.dataset.manualEdited === "true") return;

  const titleName = row.querySelector('.m-title-name').value.trim();
  const firstName = row.querySelector('.m-first-name').value.trim();
  const cFirst = firstName.toLowerCase().split(/[\s-]+/).filter(Boolean).join('.');
  const cLast = titleName.replace(/^(elder|sister)\s+/i, '').trim().toLowerCase().split(/[\s-]+/).filter(Boolean).join('.');

  if (cFirst && cLast) emailInput.value = `${cFirst}.${cLast}@missionary.org`;
  else if (cLast) emailInput.value = `${cLast}@missionary.org`;
  else emailInput.value = '';
}

function addManualRow() {
  const container = document.getElementById('manual-rows');
  const div = document.createElement('div');
  div.className = 'manual-card-row';
  div.innerHTML = `
    <input type="text" class="form-input m-title-name" placeholder="Title & Last (e.g. Elder Dela Cruz)" oninput="autoGenerateEmail(this.closest('.manual-card-row'))"/>
    <input type="text" class="form-input m-first-name" placeholder="First Name (e.g. Mark)" oninput="autoGenerateEmail(this.closest('.manual-card-row'))"/>
    <input type="text" class="form-input m-email" placeholder="Email (@missionary.org)" oninput="this.dataset.manualEdited='true'"/>
    <button class="btn-danger" style="padding:6px; height:38px;" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(div);
}

async function pushManualEntries() {
  const rows = document.querySelectorAll('.manual-card-row');
  const globalBatch = toTitleCase(document.getElementById('global-batch-input').value.trim()) || 'August 2026';
  const entries = [];

  rows.forEach(r => {
    let titleName = toTitleCase(r.querySelector('.m-title-name').value.trim());
    let firstName = toTitleCase(r.querySelector('.m-first-name').value.trim());
    let email = sanitizeEmail(r.querySelector('.m-email').value.trim());
    if (email && titleName) {
      entries.push({ title_name: titleName, first_name: firstName, email, batch: globalBatch });
    }
  });

  if (entries.length === 0) {
    showToast("Please fill out at least one missionary.", "error");
    return;
  }

  const btn = document.getElementById('push-manual-btn');
  btn.disabled = true;
  btn.textContent = 'Pushing to Database...';

  try {
    const res = await fetch('/api/main?action=push_missionaries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries })
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`Successfully added ${data.added} missionaries!`);
      document.getElementById('manual-rows').innerHTML = '';
      addManualRow();
    } else {
      showToast(data.error || "Failed to push", "error");
    }
  } catch(e) {
    showToast("Network error: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Push to Database';
  }
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('file-label').textContent = `📄 Selected: ${file.name}`;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.trim().split(/\r?\n/);
    parsedCsvData = lines.slice(1).map(l => {
      const p = l.split(',').map(s => s.trim().replace(/^["']|['"]$/g, ''));
      return { title_name: p[0], first_name: p[1] || '', email: sanitizeEmail(p[2] || p[1]) };
    }).filter(x => x.title_name && x.email);

    if (parsedCsvData.length > 0) {
      document.getElementById('push-csv-btn').style.display = 'inline-flex';
      showToast(`Parsed ${parsedCsvData.length} records from CSV.`);
    }
  };
  reader.readAsText(file);
}

async function pushCsvEntries() {
  if (parsedCsvData.length === 0) return;
  const res = await fetch('/api/main?action=push_missionaries', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entries: parsedCsvData })
  });
  const data = await res.json();
  if (data.ok) {
    showToast(`Imported ${data.added} CSV records!`);
    document.getElementById('push-csv-btn').style.display = 'none';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initAppLayout('pusher', 'Add Missionaries');
  addManualRow();
});
</script>
</body>
</html>
