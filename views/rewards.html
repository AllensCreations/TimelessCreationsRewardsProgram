<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeless Creations — Reward Catalog & Claims Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --surface2:#181822;
    --border:rgba(255,255,255,0.08);
    --gold:#c9a84c; --gold2:#f0d080; --gold-dim:rgba(201,168,76,0.15);
    --green:#4caf82; --red:#e05c5c; --blue:#5c8de0; --text:#e8e6f0; --muted:#716e88;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:24px;min-height:100vh;}
  .container{max-width:1300px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:16px;flex-wrap:wrap;gap:12px;}
  h1{font-family:'Instrument Serif',serif;font-size:1.8rem;color:var(--gold);}
  .nav-links{display:flex;gap:10px;align-items:center;}
  .btn-link{color:var(--gold);text-decoration:none;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card h3{font-family:'Syne',sans-serif;font-size:0.95rem;color:var(--gold);margin-bottom:12px;}

  .form-group{margin-bottom:10px;}
  .form-group label{font-size:0.62rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px;}
  .form-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.72rem;outline:none;width:100%;}
  
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0f;border:none;padding:10px 18px;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;}
  .btn-sm{padding:6px 12px;font-size:0.68rem;}
  .btn-success{background:rgba(76,175,130,0.2);color:var(--green);border:1px solid rgba(76,175,130,0.4);}

  .item-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-size:0.75rem;}
  
  #toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;}
  .toast{background:var(--surface2);border:1px solid var(--border);padding:12px 18px;border-radius:8px;font-size:0.72rem;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,0.6);}
  .toast.success{border-left:4px solid var(--green);color:var(--text);}
  .toast.error{border-left:4px solid var(--red);color:var(--text);}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Reward Catalog &amp; Claims Manager</h1>
      <p style="font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">Manage Point Costs &amp; Missionary Orders</p>
    </div>
    <div class="nav-links">
      <a href="/" class="btn-link">← Dashboard</a>
      <a href="/settings.html" class="btn-link">⚙️ Control Room</a>
    </div>
  </header>

  <div class="grid-2">
    <!-- CATALOG MANAGER -->
    <div class="card">
      <h3>🎁 Reward Catalog Items</h3>
      <div id="catalog-list" style="margin-bottom:14px;">Loading catalog...</div>
      
      <div style="border-top:1px solid var(--border);padding-top:12px;">
        <h4 style="font-family:'Syne',sans-serif;font-size:0.8rem;color:var(--text);margin-bottom:8px;">Add New Reward Item</h4>
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="new-item-name" class="form-input" placeholder="e.g. Leather Scripture Case"/>
        </div>
        <div class="form-group">
          <label>Points Cost</label>
          <input type="number" id="new-item-price" class="form-input" placeholder="12"/>
        </div>
        <button class="btn" onclick="addCatalogItem()">➕ Add to Catalog</button>
      </div>
    </div>

    <!-- PENDING CLAIMS / ORDERS -->
    <div class="card">
      <h3>📦 Missionary Redemption Claims (Orders)</h3>
      <div id="orders-list">Loading orders...</div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
function showToast(title, msg, type = 'success') {
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<strong>${title}</strong><div style="color:var(--muted);margin-top:2px;">${msg}</div>`;
  tc.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function fetchData() {
  try {
    const res = await fetch('/api/rewards');
    const data = await res.json();
    if (data.ok) {
      renderCatalog(data.catalog || []);
      renderOrders(data.orders || []);
    }
  } catch (err) {
    console.error(err);
  }
}

function renderCatalog(items) {
  const c = document.getElementById('catalog-list');
  if (!items.length) { c.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;">No catalog items found.</div>'; return; }
  c.innerHTML = items.map(i => `
    <div class="item-row">
      <span><strong>${i.name}</strong></span>
      <span style="color:var(--gold);font-weight:bold;">${i.price} Pts</span>
    </div>
  `).join('');
}

function renderOrders(orders) {
  const c = document.getElementById('orders-list');
  if (!orders.length) { c.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;">No pending orders found.</div>'; return; }
  c.innerHTML = orders.map(o => `
    <div class="item-row" style="flex-direction:column;align-items:flex-start;gap:6px;">
      <div style="display:flex;justify-content:space-width;width:100%;">
        <strong>${o.name || o.email}</strong>
        <span style="color:var(--gold);">${o.points_cost} Pts</span>
      </div>
      <div style="font-size:0.65rem;color:var(--muted);">Item: ${o.item} | Status: ${o.status}</div>
      <button class="btn btn-sm btn-success" onclick="fulfillOrder('${o.order_id}')">✅ Fulfill Order</button>
    </div>
  `).join('');
}

async function addCatalogItem() {
  const name = document.getElementById('new-item-name').value.trim();
  const price = parseFloat(document.getElementById('new-item-price').value);
  if (!name || isNaN(price)) { showToast("Error", "Enter valid item name and points.", "error"); return; }

  const res = await fetch('/api/rewards', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'add_catalog', name, price })
  });
  const data = await res.json();
  if (data.ok) {
    showToast("Added", "Reward item added to catalog!", "success");
    document.getElementById('new-item-name').value = '';
    document.getElementById('new-item-price').value = '';
    fetchData();
  }
}

async function fulfillOrder(order_id) {
  const res = await fetch('/api/rewards', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'fulfill_order', order_id })
  });
  const data = await res.json();
  if (data.ok) {
    showToast("Fulfilled", "Order marked as fulfilled!", "success");
    fetchData();
  }
}

window.addEventListener('DOMContentLoaded', fetchData);
</script>
</body>
</html>
